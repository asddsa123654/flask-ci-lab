name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local Docker image
        run: docker build -t flask-app-local .

      - name: Run Linter inside Docker
        run: docker run --entrypoint "" flask-app-local sh -c "pip install flake8 && flake8 . --exit-zero"

      - name: Run Tests inside Docker
        run: docker run --entrypoint "" flask-app-local pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask-ci-lab:latest
            ${{ secrets.DOCKER_USERNAME }}/flask-ci-lab:${{ github.sha }}